[workspace]
resolver = "3"
members = ["bau", "bau_test_suite"]

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["dynamic_linking", "2d", "debug"] }
bevy_prototype_lyon = "0.17.0"
bau = { path = "bau" }
bevy-trait-query = "0.19.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
